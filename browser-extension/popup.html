<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Prudence Wallet</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 240px;
        padding: 16px;
        background: #F6F4EF;
        color: #1C2430;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 4px;
      }
      p {
        font-size: 12px;
        color: #6B7280;
        margin: 0 0 14px;
        line-height: 1.4;
      }
      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        font-weight: 500;
      }
      input[type="checkbox"] {
        width: 36px;
        height: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Prudence Wallet</h1>
    <p>Shows a reflection prompt before checkout pages, across any site.</p>
    <label>
      Enabled
      <input type="checkbox" id="toggle" />
    </label>
    <script src="popup.js"></script>
  </body>
</html>
